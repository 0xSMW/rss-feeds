name: Run Feeds

on:
  schedule:
    - cron: "0 0,12 * * *" # Runs twice a day at midnight and noon
  workflow_dispatch:

jobs:
  run-feeds:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Ensure we have the branch checked out and full history for pushing
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11" # Use Python 3.11 to include distutils

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository universe
          sudo apt-get update
          sudo apt-get install -y python3-setuptools

      # Download a matched browser/driver pair directly, bypassing Ubuntu's Snap packages.
      - name: Install Chrome for Testing and ChromeDriver for Selenium
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
        with:
          chrome-version: stable
          install-chromedriver: true
          install-dependencies: true

      - name: Verify browser installation
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.chrome.outputs.chromedriver-path }}
        run: |
          "$CHROME_BINARY" --version
          "$CHROMEDRIVER_PATH" --version
          "$CHROME_BINARY" --headless --no-sandbox --disable-dev-shm-usage --dump-dom 'data:text/html,<title>browser-ready</title>' | grep -q '<title>browser-ready</title>'

      - name: Install Python dependencies and run feed generators
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.chrome.outputs.chromedriver-path }}
        run: |
          set -e  # Fail the step on any error
          uv venv
          source .venv/bin/activate
          uv pip install -r requirements.txt
          python -m unittest discover -s tests -v
          python feed_generators/run_all_feeds.py

      - name: Commit and push feed
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # Stage any changes under feeds/ (XML and any future cache files)
          git add feeds/*.xml || true

          # Commit and push if anything is staged
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update RSS feed $(date '+%m%d%Y %H%M')"
            # Push explicitly to main in case of detached HEAD
            git push origin HEAD:main
          fi
